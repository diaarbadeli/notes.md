name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          echo "BUILD_EXIT=$?" >> "$GITHUB_ENV"
          tail -c 60000 build.log

      - name: Publish build log (always, for diagnostics)
        if: always()
        continue-on-error: true
        run: |
          git config user.email "ci@local"
          git config user.name "ci-bot"
          git add -f build.log
          git commit -m "ci log [skip ci]" || true
          git push origin HEAD:ci-logs --force

      - name: Fail job if build actually failed
        if: env.BUILD_EXIT != '0'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-debug
          path: app/build/outputs/apk/debug/*.apk
